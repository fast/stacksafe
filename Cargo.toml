[workspace]
members = ["stacksafe", "stacksafe-macro", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/fast/stacksafe"
rust-version = "1.85.0"
version = "1.0.3"

[workspace.lints.rust]
unknown_lints = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
# workspace dependencies
stacksafe = { version = "1.0.3", path = "stacksafe" }
stacksafe-macro = { version = "=1.0.3", path = "stacksafe-macro" }

# crates.io dependencies
proc-macro2 = { version = "1.0.106" }
# Pin stacker's transitive dependency to preserve Rust 1.85 support.
# See https://github.com/rust-lang/stacker/issues/139.
psm = { version = "=0.1.28" }
quote = { version = "1.0.45" }
serde = { version = "1.0.228" }
stacker = { version = "0.1.24" }
syn = { version = "3.0.3", default-features = false }
trybuild = { version = "1.0.116" }
